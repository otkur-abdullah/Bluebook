 return{E,C,st,today:E.filter(x=>day(x.s.d)===t0).length,skl:Object.entries(sk).sort((a,b)=>a[1][0]/a[1][1]-b[1][0]/b[1][1]||b[1][1]-a[1][1])}}
function qod(){const A=act();return A.length?A[Math.floor(Date.now()/864e5)%A.length]:null}
function qpool(q){const A=act(),X=stats();
 if(q==='qod'){const x=qod();return x?[x]:[]}
 if(q==='miss')return X.E.filter(x=>!x.s.r).map(x=>x.it);
 if(q==='weak'){const w=X.skl.find(k=>k[1][0]<k[1][1]);return w?A.filter(x=>x.k===w[0]):[]}
 const u=A.filter(x=>x.s===q&&!SOL[x.id]);return u.length?u:A.filter(x=>x.s===q)}
const quick=q=>q==='qod'?qpool(q):shf(qpool(q)).slice(0,10);
document.addEventListener('click',e=>{if(SETO&&!e.target.closest('.br2')){SETO=0;render()}});
setZ();
render();
